<!DOCTYPE html>
<html lang="de">
    <body>
        <h1>API-Test</h1>
        <p>Seite läuft über: <b id="proto"></b></p>
        <pre id="out">Lade...</pre>
        <script>
        proto.textContent = location.protocol;

        fetch("https://api.open-meteo.com/v1/forecast?latitude=46.76&longitude=7.63&current=temperature_2m,wind_speed_10m")
        .then(r => r.json())
        .then(d => out.textContent = "✅ Funktioniert:\n" + JSON.stringify(d.current, null, 2))
        .catch(e => out.textContent = "❌ Fehler: " + e);
        </script>
    </body>
</html>
