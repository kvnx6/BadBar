<svg width="800" height="520" viewBox="0 0 800 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Karten-Hintergrund Container -->
  <rect width="800" height="520" rx="16" fill="#0F172A" stroke="#334155" stroke-width="2"/>

  <!-- REALE KARTE (Thun - Unteres Inseli) -->
  <g id="Kartenausschnitt">
    <!-- Wasser (Aare & Thunersee) -->
    <rect x="0" y="0" width="800" height="520" rx="16" fill="#A4D3FF"/>

    <!-- Insel-Landmasse (Unteres Inseli) -->
    <path d="M 220 -10 L 390 -10 L 520 530 L 350 530 Z" fill="#FFFFFF"/>

    <!-- Uferbereich / Festland Links -->
    <path d="M -10 -10 L 150 -10 L 0 530 L -10 530 Z" fill="#EAEAEA"/>

    <!-- Scherzligweg & Gebäude-Umrisse -->
    <line x1="80" y1="-10" x2="-20" y2="450" stroke="#787878" stroke-width="3"/>
    <rect x="20" y="80" width="35" height="45" fill="#D4D4D4" stroke="#A3A3A3" stroke-width="1.5" transform="rotate(-15 20 80)"/>
    <rect x="35" y="160" width="40" height="25" fill="#D4D4D4" stroke="#A3A3A3" stroke-width="1.5" transform="rotate(-15 35 160)"/>
    <rect x="50" y="220" width="55" height="35" fill="#D4D4D4" stroke="#A3A3A3" stroke-width="1.5" transform="rotate(-15 50 220)"/>

    <!-- Strassennamen & Inseltext -->
    <text x="130" y="180" fill="#262626" font-family="Arial, sans-serif" font-size="22" font-weight="700" transform="rotate(78 130 180)">Scherzligweg</text>
    <text x="310" y="270" fill="#404040" font-family="Arial, sans-serif" font-size="28" font-style="italic" font-weight="600">Unteres</text>
    <text x="330" y="305" fill="#404040" font-family="Arial, sans-serif" font-size="28" font-style="italic" font-weight="600">Inseli</text>
  </g>

  <!-- STANDORT-PIN (Geklickter Ort im Wasser) -->
  <g transform="translate(480, 220)">
    <!-- Klick-Welle -->
    <circle cx="0" cy="0" r="38" fill="#FF6B57" opacity="0.25"/>
    <circle cx="0" cy="0" r="20" fill="#FF6B57" opacity="0.45"/>
    <circle cx="0" cy="0" r="7" fill="#FF6B57"/>

    <!-- Map Pin Icon -->
    <g transform="translate(-16, -44)">
      <path d="M 16 0 C 7.16 0 0 7.16 0 16 C 0 28 16 44 16 44 C 16 44 32 28 32 16 C 32 7.16 24.84 0 16 0 Z" fill="#FF6B57"/>
      <circle cx="16" cy="16" r="6" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- MAUSZEIGER (Klick-Aktion auf den Pin) -->
  <g transform="translate(492, 232)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.9"/>
    <path d="M 0 0 L 0 26 L 6 20 L 12 32 L 17 30 L 11 18 L 19 18 Z" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
  </g>
</svg>
